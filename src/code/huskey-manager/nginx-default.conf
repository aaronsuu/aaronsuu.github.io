server {
    listen 443 ssl;
    server_name localhost;  
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;  
    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Attachments are only served through download_file.php (which checks vault permissions).
    # ^~ wins over the .php regex below, so an uploaded script can never be executed.
    location ^~ /vaults/uploads/ {
        deny all;
    }

    location ~ \.php$ {
       fastcgi_pass   backend-php-server:9000;
       fastcgi_index  index.php;
       fastcgi_param REQUEST_METHOD $request_method;
       fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
       include        fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
