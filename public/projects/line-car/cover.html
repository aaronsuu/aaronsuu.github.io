<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
#wrap { width: 460px; padding: 20px; position: absolute; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap">
</head>
<body>
<div id="wrap">
  <div style="width: 100%; background: #111214; border: 1.5px solid rgba(255,255,255,0.11); padding: 22px 24px;">
    <div style="display: grid; grid-template-columns: 155px 1fr; column-gap: 18px; height: 220px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 6px 7px; display: flex; gap: 4px; align-items: center; align-content: center; min-height: 28px; flex-wrap: wrap;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.08); padding: 1px 4px; line-height: 10px; white-space: nowrap;">C++</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.08); padding: 1px 4px; line-height: 10px; white-space: nowrap;">PCB</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.08); padding: 1px 4px; line-height: 10px; white-space: nowrap;">KICAD</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.08); padding: 1px 4px; line-height: 10px; white-space: nowrap;">PID</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: rgba(255,255,255,0.3); letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.08); padding: 1px 4px; line-height: 10px; white-space: nowrap;">OP-AMP</span>
        </div>
        <div style="flex: 1; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); display: flex; align-items: center; justify-content: center;">
          <img src="/projects/logos/cpp.png" alt="C++" width="98" height="110" style="display: block;">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 10px 14px 12px;">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 17.5px; color: rgba(255,255,255,0.85); line-height: 1.25; display: block;">Self-Driving<br>Remote Driving<br>Car</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center; padding: 2px 2px 0;"><img src="/projects/logos/kicad.svg" alt="kicad" style="height: 40px; max-width: 88px; width: auto; display: block;"></div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 4px 10px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;">06/08/2025</span>
          </div>
          <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 5px 12px;">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 14px; white-space: nowrap; color: rgba(255,255,255,0.38);">aaron su<span style="color: rgba(137,207,240,0.6);">.</span></span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function fit() {
  var wrap = document.getElementById('wrap');
  var dw = wrap.offsetWidth;
  var dh = wrap.offsetHeight;
  if (!dw || !dh) return;
  var sx = window.innerWidth / dw;
  var sy = window.innerHeight / dh;
  var s = Math.min(sx, sy);
  wrap.style.transformOrigin = 'top left';
  wrap.style.transform = 'scale(' + s + ')';
  wrap.style.left = ((window.innerWidth - dw * s) / 2) + 'px';
  wrap.style.top = ((window.innerHeight - dh * s) / 2) + 'px';
}
fit();
window.addEventListener('resize', fit);
document.fonts && document.fonts.ready && document.fonts.ready.then(fit);
</script>
</body>
</html>
