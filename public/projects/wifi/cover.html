<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
#wrap { width: 460px; padding: 20px; position: absolute; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap">
</head>
<body>
<div id="wrap">
  <div style="width: 100%; background: #111214; border: 1.5px solid rgba(255,255,255,0.11); padding: 22px 24px;">
    <div style="display: grid; grid-template-columns: 155px 1fr; column-gap: 18px; height: 220px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 6px 8px; display: flex; gap: 5px; align-items: center; min-height: 34px; flex-wrap: wrap;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 6px;">NumPy</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 6px;">CommPy</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 6px;">OFDM</span>
        </div>
        <div style="flex: 1; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 256 255" xmlns="http://www.w3.org/2000/svg" width="60" height="60" style="opacity: 0.3;">
            <defs>
              <linearGradient x1="12.959%" y1="12.039%" x2="79.639%" y2="78.201%" id="pyBlue">
                <stop stop-color="#387EB8" offset="0%"/>
                <stop stop-color="#366994" offset="100%"/>
              </linearGradient>
              <linearGradient x1="19.128%" y1="20.579%" x2="90.742%" y2="88.429%" id="pyYellow">
                <stop stop-color="#FFE052" offset="0%"/>
                <stop stop-color="#FFC331" offset="100%"/>
              </linearGradient>
            </defs>
            <path d="M126.916.072c-64.832 0-60.784 28.115-60.784 28.115l.072 29.128h61.868v8.745H41.631S.145 61.355.145 126.77c0 65.417 36.21 63.097 36.21 63.097h21.61v-30.356s-1.165-36.21 35.632-36.21h61.362s34.475.557 34.475-33.319V33.97S194.67.072 126.916.072zM92.802 19.66a11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13 11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13z" fill="url(#pyBlue)"/>
            <path d="M128.757 254.126c64.832 0 60.784-28.115 60.784-28.115l-.072-29.127H127.6v-8.745h86.441s41.486 4.705 41.486-60.712c0-65.416-36.21-63.096-36.21-63.096h-21.61v30.355s1.165 36.21-35.632 36.21h-61.362s-34.475-.557-34.475 33.32v56.013s-5.235 33.897 62.518 33.897zm34.114-19.586a11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13 11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13z" fill="url(#pyYellow)"/>
          </svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 9px 14px;">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 26px; color: rgba(255,255,255,0.85); letter-spacing: -0.5px; line-height: 1.15; display: block;">Wi-Fi Transmitter<br>& Receiver</span>
          </div>
          <div style="align-self: flex-start; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 4px 10px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;">05/28/2026</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end;">
          <div style="border: 1px solid rgba(255,255,255,0.07); padding: 5px 12px; background: rgba(255,255,255,0.018);">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 14px; color: rgba(255,255,255,0.38);">aaron su<span style="color: rgba(137,207,240,0.6);">.</span></span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function fit() {
  var wrap = document.getElementById('wrap');
  var dw = wrap.offsetWidth;
  var dh = wrap.offsetHeight;
  if (!dw || !dh) return;
  var sx = window.innerWidth / dw;
  var sy = window.innerHeight / dh;
  var s = Math.min(sx, sy);
  wrap.style.transformOrigin = 'top left';
  wrap.style.transform = 'scale(' + s + ')';
  wrap.style.left = ((window.innerWidth - dw * s) / 2) + 'px';
  wrap.style.top = ((window.innerHeight - dh * s) / 2) + 'px';
}
fit();
window.addEventListener('resize', fit);
document.fonts && document.fonts.ready && document.fonts.ready.then(fit);
</script>
</body>
</html>
