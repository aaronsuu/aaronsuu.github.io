<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } html, body { width: 100%; min-height: 100vh; background: #0a0a0a; }</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap">

<div style="padding: 1.5rem 0; display: flex; flex-direction: column; align-items: center; gap: 18px;">

  <div style="width: 100%; background: #111214; border: 1.5px solid rgba(255,255,255,0.11); padding: 22px 24px; box-sizing: border-box;">
    <div style="display: grid; grid-template-columns: 185px 1fr; column-gap: 20px; height: 242px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="flex: 1; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 256 255" xmlns="http://www.w3.org/2000/svg" width="70" height="70" style="opacity: 0.3;">
            <defs>
              <linearGradient x1="12.959%" y1="12.039%" x2="79.639%" y2="78.201%" id="pyBlue2">
                <stop stop-color="#387EB8" offset="0%"/>
                <stop stop-color="#366994" offset="100%"/>
              </linearGradient>
              <linearGradient x1="19.128%" y1="20.579%" x2="90.742%" y2="88.429%" id="pyYellow2">
                <stop stop-color="#FFE052" offset="0%"/>
                <stop stop-color="#FFC331" offset="100%"/>
              </linearGradient>
            </defs>
            <path d="M126.916.072c-64.832 0-60.784 28.115-60.784 28.115l.072 29.128h61.868v8.745H41.631S.145 61.355.145 126.77c0 65.417 36.21 63.097 36.21 63.097h21.61v-30.356s-1.165-36.21 35.632-36.21h61.362s34.475.557 34.475-33.319V33.97S194.67.072 126.916.072zM92.802 19.66a11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13 11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13z" fill="url(#pyBlue2)"/>
            <path d="M128.757 254.126c64.832 0 60.784-28.115 60.784-28.115l-.072-29.127H127.6v-8.745h86.441s41.486 4.705 41.486-60.712c0-65.416-36.21-63.096-36.21-63.096h-21.61v30.355s1.165 36.21-35.632 36.21h-61.362s-34.475-.557-34.475 33.32v56.013s-5.235 33.897 62.518 33.897zm34.114-19.586a11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13 11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13z" fill="url(#pyYellow2)"/>
          </svg>
        </div>
        <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 7px 10px; display: flex; gap: 6px; align-items: center; min-height: 38px; flex-wrap: wrap;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 7px;">TCP</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 7px;">THREADING</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.08); padding: 2px 7px;">DIJKSTRA</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 9px 15px;">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 28px; color: rgba(255,255,255,0.85); letter-spacing: -0.5px; line-height: 1.15; display: block;">Content Distribution<br>Overlay</span>
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-style: italic; font-size: 16px; color: rgba(255,255,255,0.38); letter-spacing: 0px; line-height: 1.4; display: block; margin-top: 4px;">(Link-State Routing)</span>
          </div>
          <div style="align-self: flex-start; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.018); padding: 5px 11px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 1px;">05/28/2026</span>
          </div>
        </div>
        <div id="bottom-row-02" style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
          <div style="border: 1px solid rgba(255,255,255,0.07); padding: 6px 14px; background: rgba(255,255,255,0.018);">
            <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 15px; color: rgba(255,255,255,0.38);">aaron su<span style="color: rgba(137,207,240,0.6);">.</span></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div style="display: flex; gap: 0;">
    <button onclick="setVariant02('personal')" id="btn-personal-02" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-right: none; color: rgba(255,255,255,0.5); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 3px; padding: 7px 18px; cursor: pointer; text-transform: uppercase; border-radius: 0;">personal</button>
    <button onclick="setVariant02('uw')" id="btn-uw-02" style="background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.2); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 3px; padding: 7px 18px; cursor: pointer; text-transform: uppercase; border-radius: 0;">uw · class</button>
  </div>

  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.15); letter-spacing: 4px; text-transform: uppercase;">project 02 · link-state routing</span>
</div>

<script>
function setVariant02(v) {
  const btnP = document.getElementById('btn-personal-02');
  const btnU = document.getElementById('btn-uw-02');
  const br   = document.getElementById('bottom-row-02');
  btnP.style.background = v === 'personal' ? 'rgba(255,255,255,0.06)' : 'transparent';
  btnP.style.color       = v === 'personal' ? 'rgba(255,255,255,0.5)'  : 'rgba(255,255,255,0.2)';
  btnU.style.background = v === 'uw'        ? 'rgba(255,255,255,0.06)' : 'transparent';
  btnU.style.color       = v === 'uw'        ? 'rgba(255,255,255,0.5)'  : 'rgba(255,255,255,0.2)';
  if (v === 'uw') {
    br.innerHTML = `
      <div style="border:1px solid rgba(255,255,255,0.07);padding:5px 11px;background:rgba(255,255,255,0.018);">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,0.28);letter-spacing:2px;text-transform:uppercase;">EE 419</span>
      </div>
      <div style="border:1px solid rgba(255,255,255,0.07);padding:6px 14px;background:rgba(255,255,255,0.018);">
        <span style="font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:16px;color:rgba(217,195,117,0.65);letter-spacing:1px;">W</span>
      </div>`;
  } else {
    br.innerHTML = `
      <div style="border:1px solid rgba(255,255,255,0.07);padding:6px 14px;background:rgba(255,255,255,0.018);">
        <span style="font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:15px;color:rgba(255,255,255,0.38);">aaron su<span style="color:rgba(137,207,240,0.6);">.</span></span>
      </div>`;
  }
}
</script>
</body>
</html>
